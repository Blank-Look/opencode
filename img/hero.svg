<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="brick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A1B2C"/>
      <stop offset="1" stop-color="#A3243B"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2E4A"/>
      <stop offset="1" stop-color="#243E5E"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Light background — complements the page's maroon gradient, matches the toolchain graphic standard -->
  <rect width="900" height="520" fill="#F8F7F6" rx="24"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#1C1A18" letter-spacing="-0.3">SchoolCode</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#847E78" letter-spacing="0.5">AI-Assisted Delivery — Governed. Aligned. Fast.</text>

  <!-- ===== LAYER 1: Vibe AI Coding (brick) ===== -->
  <g filter="url(#shadow)">
    <rect x="50" y="88" width="800" height="90" rx="14" fill="#FFFFFF" stroke="#E2E0DE"/>
  </g>
  <rect x="50" y="88" width="8" height="90" rx="4" fill="url(#brick)"/>

  <text x="78" y="112" font-size="12" font-weight="700" fill="#A3243B" letter-spacing="2">SCHOOLCODE</text>
  <text x="78" y="136" font-size="16" font-weight="800" fill="#1C1A18">Vibe AI Coding</text>
  <text x="78" y="156" font-size="12" fill="#75847E">Fast, iterative, creative development — unconstrained speed where it counts.</text>

  <!-- benefits badges -->
  <g font-size="11" font-weight="600" text-anchor="middle">
    <rect x="524" y="100" width="94" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="571" y="115" fill="#1D4ED8">Fast Development</text>
    <rect x="626" y="100" width="88" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="670" y="115" fill="#1D4ED8">Rapid Iteration</text>
    <rect x="722" y="100" width="110" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="777" y="115" fill="#1D4ED8">AI-Powered Velocity</text>
  </g>

  <!-- ===== ARROW PILL 1 ===== -->
  <rect x="385" y="183" width="130" height="26" rx="13" fill="#1C1A18"/>
  <text x="450" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">channeled through</text>

  <!-- ===== LAYER 2: AI-Assisted Delivery Cycle (navy) ===== -->
  <g filter="url(#shadow)">
    <rect x="50" y="215" width="800" height="110" rx="14" fill="#FFFFFF" stroke="#E2E0DE"/>
  </g>
  <rect x="50" y="215" width="8" height="110" rx="4" fill="url(#navy)"/>

  <text x="78" y="239" font-size="12" font-weight="700" fill="#243E5E" letter-spacing="2">SCHOOLAPPS</text>
  <text x="78" y="261" font-size="16" font-weight="800" fill="#1C1A18">AI-Assisted Delivery Cycle</text>
  <text x="78" y="279" font-size="12" fill="#75847E">Structured 7-phase delivery with built-in guardrails, gates, and audit trail.</text>

  <!-- SDLC phase bubbles -->
  <g transform="translate(78, 285)" text-anchor="middle">
    <rect x="0" y="0" rx="8" width="86" height="26" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="43" y="17" font-size="10" font-weight="600" fill="#1D4ED8">1. Capture</text>
    <text x="43" y="36" font-size="8" fill="#75847E">Requirement</text>
    <line x1="92" y1="13" x2="110" y2="13" stroke="#D5E0DD" stroke-width="1.5"/>

    <rect x="116" y="0" rx="8" width="86" height="26" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="159" y="17" font-size="10" font-weight="600" fill="#1D4ED8">2. Govern</text>
    <text x="159" y="36" font-size="8" fill="#75847E">Controls</text>
    <line x1="208" y1="13" x2="226" y2="13" stroke="#D5E0DD" stroke-width="1.5"/>

    <rect x="232" y="0" rx="8" width="86" height="26" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="275" y="17" font-size="10" font-weight="600" fill="#1D4ED8">3. Generate</text>
    <text x="275" y="36" font-size="8" fill="#75847E">AI Prompt</text>
    <line x1="324" y1="13" x2="342" y2="13" stroke="#D5E0DD" stroke-width="1.5"/>

    <rect x="348" y="0" rx="8" width="86" height="26" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="391" y="17" font-size="10" font-weight="600" fill="#1D4ED8">4. Build</text>
    <text x="391" y="36" font-size="8" fill="#75847E">Code + Tests</text>
    <line x1="440" y1="13" x2="458" y2="13" stroke="#D5E0DD" stroke-width="1.5"/>

    <rect x="464" y="0" rx="8" width="86" height="26" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="507" y="17" font-size="10" font-weight="600" fill="#1D4ED8">5. Assure</text>
    <text x="507" y="36" font-size="8" fill="#75847E">Review + Test</text>
    <line x1="556" y1="13" x2="574" y2="13" stroke="#D5E0DD" stroke-width="1.5"/>

    <rect x="580" y="0" rx="8" width="86" height="26" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="623" y="17" font-size="10" font-weight="600" fill="#1D4ED8">6. Release</text>
    <text x="623" y="36" font-size="8" fill="#75847E">CI/CD</text>
    <line x1="672" y1="13" x2="690" y2="13" stroke="#D5E0DD" stroke-width="1.5"/>

    <rect x="696" y="0" rx="8" width="86" height="26" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="739" y="17" font-size="10" font-weight="600" fill="#1D4ED8">7. Operate</text>
    <text x="739" y="36" font-size="8" fill="#75847E">Monitor</text>
  </g>

  <!-- ===== ARROW PILL 2 ===== -->
  <rect x="385" y="330" width="130" height="26" rx="13" fill="#1C1A18"/>
  <text x="450" y="347" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">governed by</text>

  <!-- ===== LAYER 3: Governance Foundation (teal) ===== -->
  <g filter="url(#shadow)">
    <rect x="50" y="362" width="800" height="90" rx="14" fill="#FFFFFF" stroke="#E2E0DE"/>
  </g>
  <rect x="50" y="362" width="8" height="90" rx="4" fill="url(#pulse)"/>

  <text x="78" y="386" font-size="12" font-weight="700" fill="#0F766E" letter-spacing="2">SCHOOLPULSE</text>
  <text x="78" y="410" font-size="16" font-weight="800" fill="#1C1A18">Governance Foundation</text>
  <text x="78" y="428" font-size="12" fill="#75847E">Every deliverable is automatically aligned with institutional standards.</text>

  <!-- solved-problem badges -->
  <g transform="translate(78, 430)" text-anchor="middle">
    <rect x="0" y="0" rx="10" width="72" height="20" fill="#ECFDF5" stroke="#99F6E4"/>
    <text x="36" y="14" font-size="9.5" font-weight="500" fill="#0F766E">✓ Discipline</text>
    <rect x="80" y="0" rx="10" width="76" height="20" fill="#ECFDF5" stroke="#99F6E4"/>
    <text x="118" y="14" font-size="9.5" font-weight="500" fill="#0F766E">✓ Accuracy</text>
    <rect x="164" y="0" rx="10" width="76" height="20" fill="#ECFDF5" stroke="#99F6E4"/>
    <text x="202" y="14" font-size="9.5" font-weight="500" fill="#0F766E">✓ Alignment</text>
    <rect x="248" y="0" rx="10" width="62" height="20" fill="#ECFDF5" stroke="#99F6E4"/>
    <text x="279" y="14" font-size="9.5" font-weight="500" fill="#0F766E">✓ Cost</text>
    <rect x="318" y="0" rx="10" width="96" height="20" fill="#ECFDF5" stroke="#99F6E4"/>
    <text x="366" y="14" font-size="9.5" font-weight="500" fill="#0F766E">✓ Asset Governance</text>
    <rect x="422" y="0" rx="10" width="96" height="20" fill="#ECFDF5" stroke="#99F6E4"/>
    <text x="470" y="14" font-size="9.5" font-weight="500" fill="#0F766E">✓ Security Governance</text>
  </g>

  <!-- right-side feature highlight -->
  <g transform="translate(620, 362)">
    <rect x="0" y="0" rx="10" width="220" height="90" fill="#ECFDF5" stroke="#99F6E4" stroke-width="1"/>
    <text x="110" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0F766E">Global SDLC Changes</text>
    <text x="110" y="44" text-anchor="middle" font-size="10" fill="#0F766E">When the SDLC evolves, every</text>
    <text x="110" y="59" text-anchor="middle" font-size="10" fill="#0F766E">existing app and ongoing work</text>
    <text x="110" y="74" text-anchor="middle" font-size="10" fill="#0F766E">is instantly realigned globally.</text>
  </g>

  <!-- Bottom tagline -->
  <text x="450" y="500" text-anchor="middle" font-size="11" fill="#75847E" letter-spacing="0.3">Vibe at speed. Ship with confidence. Govern automatically.</text>
</svg>
